name: Build and push FRR image

on:
  # Weekly check for a new upstream FRR release.
  schedule:
    - cron: '0 6 * * 1'
  # Manual run: leave "version" empty to auto-detect the latest upstream
  # release, or set it to force-build a specific tag (rebuilds even if that
  # tag already exists on Docker Hub, e.g. after changing daemons-all.txt).
  workflow_dispatch:
    inputs:
      version:
        description: 'FRR version to build (e.g. 10.7.0). Empty = latest upstream release.'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine target FRR version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG=$(curl -sf https://api.github.com/repos/FRRouting/frr/releases/latest | jq -r '.tag_name')
            # Upstream release tags look like "frr-10.7.0".
            VERSION="${TAG#frr-}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/africodes/frrouting/tags/${VERSION}/")
          echo "Existing tag lookup for ${VERSION}: HTTP ${STATUS}"
          if [ "$STATUS" = "200" ] && [ -z "${{ github.event.inputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        run: ./build.sh "${{ steps.version.outputs.version }}" --push

      - name: Skipped
        if: steps.check.outputs.skip == 'true'
        run: echo "africodes/frrouting:${{ steps.version.outputs.version }} already exists on Docker Hub, nothing to do."
